name: CI

on:
  push:
    branches: ["main", "develop", "feature/**", "fix/**"]
  pull_request:

permissions:
  contents: read
  packages: read

jobs:
  release-metadata:
    name: Metadados da release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validar consistência da versão
        run: bash deploy/scripts/validate-version.sh

  laravel:
    name: Laravel
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v6
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, intl, pdo_sqlite, bcmath
          coverage: none
          tools: composer:v2
      - name: Preparar ambiente de testes Laravel
        run: |
          set -Eeuo pipefail
          test -f .env.example
          cp -- .env.example .env
          test -s .env
      - name: Validar Composer
        run: composer validate --strict --no-check-lock
      - name: Instalar dependências PHP
        run: composer install --no-interaction --no-progress --prefer-dist
      - name: Validar sintaxe PHP
        run: find app bootstrap config database routes tests -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Testes Laravel
        run: php artisan test

  converter:
    name: Conversor Python
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/converter
    env:
      PDF2OFX_API_KEY: test-internal-key-123456789
      PDF2OFX_DATA_DIR: /tmp/pdf2ofx-tests
      PDF2OFX_OCR_ENABLED: "false"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: services/converter/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - run: python -m compileall -q src
      - run: pytest --cov=pdf2ofx --cov-report=term-missing

  compose:
    name: Docker Compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validar Compose do repositório
        run: |
          cp .env.example .env
          docker compose --env-file .env config >/dev/null
          docker compose --env-file .env -f compose.yaml -f compose.production.yaml config >/dev/null
      - name: Validar pacote independente de implantação
        run: |
          cp deploy/docker/.env.example deploy/docker/.env
          cmp -s deploy/docker/compose.yaml deploy/docker/docker-compose.yml
          docker compose \
            --env-file deploy/docker/.env \
            -f deploy/docker/compose.yaml \
            config >/dev/null
          docker compose \
            --env-file deploy/docker/.env \
            -f deploy/docker/docker-compose.yml \
            config >/dev/null

      - name: Validar pacotes Dockge
        run: |
          cp deploy/dockge/dockge/.env.example deploy/dockge/dockge/.env
          cp deploy/dockge/pdf2ofx/.env.example deploy/dockge/pdf2ofx/.env
          docker compose \
            --env-file deploy/dockge/dockge/.env \
            -f deploy/dockge/dockge/compose.yaml \
            config >/dev/null
          docker compose \
            --env-file deploy/dockge/pdf2ofx/.env \
            -f deploy/dockge/pdf2ofx/compose.yaml \
            config >/dev/null
          bash deploy/dockge/install-vps.sh --help >/dev/null

      - name: Validar distribuição de stack existente
        run: |
          cp deploy/stack/.env.example deploy/stack/.env
          docker compose \
            --env-file deploy/stack/.env \
            -f deploy/stack/compose.yaml \
            config >/dev/null
          bash deploy/stack/scripts/configure.sh --help >/dev/null

  workflows:
    name: Workflows e scripts de implantação
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Validar sintaxe YAML dos workflows
        run: |
          ruby -ryaml -e '
            Dir[".github/workflows/*.{yml,yaml}"].sort.each do |file|
              YAML.safe_load(File.read(file), aliases: true)
              puts "OK: #{file}"
            end
          '

      - name: Validar scripts Shell
        run: |
          find deploy -type f -name "*.sh" -print0 \
            | xargs -0 -n1 bash -n

      - name: Validar estrutura do Laravel
        run: |
          set -Eeuo pipefail
          test -f apps/web/.env.example
          test -f apps/web/composer.json
          test -f apps/web/artisan
          grep -Fq 'APP_ENV=local' apps/web/.env.example
          grep -Fq 'DB_CONNECTION=pgsql' apps/web/.env.example
          grep -Fq 'CONVERTER_BASE_URL=http://converter-api:8000' apps/web/.env.example

      - name: Testar espelhamento sequencial e retry
        run: bash deploy/scripts/tests/test-mirror-base-images.sh

      - name: Testar instalador Dockge com Docker simulado
        run: bash deploy/dockge/tests/test-install-vps.sh

      - name: Testar distribuição para infraestrutura existente
        run: bash deploy/stack/tests/test-stack-package.sh

      - name: Validar instalação da extensão Redis sem PECL REST
        run: |
          set -Eeuo pipefail
          dockerfile="apps/web/docker/Dockerfile"

          if grep -nE 'pecl[[:space:]]+install[[:space:]]+redis' "$dockerfile"; then
            echo "ERRO: o build não pode depender do serviço REST do PECL." >&2
            exit 1
          fi

          grep -Fq 'REDIS_EXTENSION_VERSION=6.3.0' "$dockerfile"
          grep -Fq 'phpredis/archive/refs/tags/${REDIS_EXTENSION_VERSION}.tar.gz' "$dockerfile"
          grep -Fq 'COPY apps/web/public /var/www/html/public' "$dockerfile"

          if grep -Fq 'COPY --from=app /var/www/html/public' "$dockerfile"; then
            echo "ERRO: o gateway não deve recompilar o estágio PHP." >&2
            exit 1
          fi

      - name: Impedir actions obsoletas e espelhamento multi-arquitetura em paralelo
        run: |
          set -Eeuo pipefail

          if grep -R -nE \
            '^[[:space:]]*uses:[[:space:]]*(actions/checkout@v5|docker/login-action@v3|docker/setup-buildx-action@v3|docker/build-push-action@v6|docker/metadata-action@v5|actions/upload-artifact@v4)([[:space:]]|$)' \
            .github/workflows; then
            echo "ERRO: foram encontradas versões obsoletas de GitHub Actions." >&2
            exit 1
          fi

          forbidden_mirror_command="docker buildx imagetools"
          forbidden_mirror_command+=" create"

          if grep -R -n "$forbidden_mirror_command" .github/workflows; then
            echo "ERRO: o espelhamento multi-arquitetura não deve ser usado neste projeto." >&2
            exit 1
          fi

  docker-build:
    name: Build real ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - file: apps/web/docker/Dockerfile
            target: app
            image: pdf2ofx-ci-app
            build_args: |
              PHP_BASE_IMAGE=ghcr.io/${{ github.repository_owner }}/pdf2ofx-base-php:8.4-fpm-alpine
              COMPOSER_BASE_IMAGE=ghcr.io/${{ github.repository_owner }}/pdf2ofx-base-composer:2.8
              REDIS_EXTENSION_VERSION=6.3.0
          - file: apps/web/docker/Dockerfile
            target: gateway
            image: pdf2ofx-ci-gateway
            build_args: |
              NGINX_BASE_IMAGE=ghcr.io/${{ github.repository_owner }}/pdf2ofx-base-nginx:1.28-alpine
          - file: services/converter/Dockerfile
            target: runtime
            image: pdf2ofx-ci-converter
            build_args: |
              PYTHON_BASE_IMAGE=ghcr.io/${{ github.repository_owner }}/pdf2ofx-base-python:3.13-slim-bookworm
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - name: Autenticar no GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compilar imagem integralmente
        env:
          BUILD_ARGS_TEXT: ${{ matrix.build_args }}
        run: |
          set -Eeuo pipefail
          build_args=()
          while IFS= read -r item; do
            [[ -n "$item" ]] && build_args+=(--build-arg "$item")
          done <<< "$BUILD_ARGS_TEXT"

          docker buildx build \
            --file "${{ matrix.file }}" \
            --target "${{ matrix.target }}" \
            --platform linux/amd64 \
            --pull \
            --load \
            --tag "${{ matrix.image }}:${GITHUB_SHA}" \
            --cache-from "type=gha,scope=ci-${{ matrix.target }}" \
            --cache-to "type=gha,mode=max,scope=ci-${{ matrix.target }}" \
            "${build_args[@]}" \
            .
      - name: Validar runtime
        run: |
          case "${{ matrix.target }}" in
            app)
              docker run --rm --entrypoint php "${{ matrix.image }}:${GITHUB_SHA}" -m | grep -Fx redis
              docker run --rm --entrypoint php "${{ matrix.image }}:${GITHUB_SHA}" artisan --version
              ;;
            gateway)
              bash deploy/scripts/validate-gateway-image.sh "${{ matrix.image }}:${GITHUB_SHA}"
              ;;
            runtime)
              docker run --rm --entrypoint python "${{ matrix.image }}:${GITHUB_SHA}" -c 'import pdf2ofx; print(pdf2ofx.__version__)'
              ;;
          esac
