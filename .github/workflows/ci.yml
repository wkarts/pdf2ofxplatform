name: CI

on:
  push:
    branches: ["main", "develop", "feature/**", "fix/**"]
  pull_request:

permissions:
  contents: read

jobs:
  laravel:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, intl, pdo_sqlite, bcmath
          coverage: none
          tools: composer:v2
      - name: Validar Composer
        run: composer validate --strict --no-check-lock
      - name: Instalar dependências PHP
        run: composer install --no-interaction --no-progress --prefer-dist
      - name: Validar sintaxe PHP
        run: find app bootstrap config database routes tests -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Testes Laravel
        run: php artisan test

  converter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/converter
    env:
      PDF2OFX_API_KEY: test-internal-key-123456789
      PDF2OFX_DATA_DIR: /tmp/pdf2ofx-tests
      PDF2OFX_OCR_ENABLED: "false"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: services/converter/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - run: python -m compileall -q src
      - run: pytest --cov=pdf2ofx --cov-report=term-missing

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: cp .env.example .env
      - run: docker compose --env-file .env config >/dev/null
