name: GitHub Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Gerar pacote de código
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          git archive --format=zip --prefix="pdf2ofx-${VERSION}/" \
            --output="pdf2ofx-${VERSION}.zip" HEAD
          sha256sum "pdf2ofx-${VERSION}.zip" > "pdf2ofx-${VERSION}.zip.sha256"
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            pdf2ofx-*.zip
            pdf2ofx-*.sha256
