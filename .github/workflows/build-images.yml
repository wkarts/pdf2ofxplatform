name: Build and publish images

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: build-images-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  NAMESPACE: ${{ github.repository_owner }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: pdf2ofx-app
            dockerfile: apps/web/docker/Dockerfile
            target: app
            build_args: |
              PHP_BASE_IMAGE=ghcr.io/${{ github.repository_owner }}/pdf2ofx-base-php:8.4-fpm-alpine
              COMPOSER_BASE_IMAGE=ghcr.io/${{ github.repository_owner }}/pdf2ofx-base-composer:2.8
              NGINX_BASE_IMAGE=ghcr.io/${{ github.repository_owner }}/pdf2ofx-base-nginx:1.28-alpine
          - image: pdf2ofx-gateway
            dockerfile: apps/web/docker/Dockerfile
            target: gateway
            build_args: |
              PHP_BASE_IMAGE=ghcr.io/${{ github.repository_owner }}/pdf2ofx-base-php:8.4-fpm-alpine
              COMPOSER_BASE_IMAGE=ghcr.io/${{ github.repository_owner }}/pdf2ofx-base-composer:2.8
              NGINX_BASE_IMAGE=ghcr.io/${{ github.repository_owner }}/pdf2ofx-base-nginx:1.28-alpine
          - image: pdf2ofx-converter
            dockerfile: services/converter/Dockerfile
            target: runtime
            build_args: |
              PYTHON_BASE_IMAGE=ghcr.io/${{ github.repository_owner }}/pdf2ofx-base-python:3.13-slim-bookworm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          build-args: ${{ matrix.build_args }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
          provenance: true
          sbom: true
