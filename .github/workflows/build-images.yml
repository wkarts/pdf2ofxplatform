name: Build and publish images

on:
  workflow_call:
    inputs:
      version:
        description: Versão sem o prefixo v
        required: true
        type: string
      ref:
        description: Commit, tag ou branch que será compilado
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: "Versão sem o prefixo v (ex.: 1.1.3)"
        required: true
        type: string
      ref:
        description: Commit, tag ou branch que será compilado
        required: true
        default: main
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: build-images-${{ inputs.version }}-${{ inputs.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validar versão e origem
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      source_sha: ${{ steps.metadata.outputs.source_sha }}
    steps:
      - name: Obter código-fonte
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - name: Validar metadados
        id: metadata
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -Eeuo pipefail
          VERSION="$(tr -d '[:space:]' < VERSION)"

          if [[ ! "$REQUESTED_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Versão inválida: $REQUESTED_VERSION" >&2
            exit 1
          fi

          if [[ "$VERSION" != "$REQUESTED_VERSION" ]]; then
            echo "A versão solicitada ($REQUESTED_VERSION) difere do arquivo VERSION ($VERSION)." >&2
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "source_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Autenticar no GHCR para validar imagens-base
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Confirmar imagens-base necessárias
        env:
          GHCR_OWNER: ${{ github.repository_owner }}
        run: |
          set -Eeuo pipefail
          images=(
            "pdf2ofx-base-php:8.4-fpm-alpine"
            "pdf2ofx-base-composer:2.8"
            "pdf2ofx-base-nginx:1.28-alpine"
            "pdf2ofx-base-python:3.13-slim-bookworm"
          )

          for image in "${images[@]}"; do
            docker manifest inspect "ghcr.io/${GHCR_OWNER}/${image}" >/dev/null
            echo "OK: ghcr.io/${GHCR_OWNER}/${image}"
          done

  build:
    name: Build ${{ matrix.image }}
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - image: pdf2ofx-app
            dockerfile: apps/web/docker/Dockerfile
            target: app
            build_args: |
              PHP_BASE_IMAGE=ghcr.io/${{ github.repository_owner }}/pdf2ofx-base-php:8.4-fpm-alpine
              COMPOSER_BASE_IMAGE=ghcr.io/${{ github.repository_owner }}/pdf2ofx-base-composer:2.8
              NGINX_BASE_IMAGE=ghcr.io/${{ github.repository_owner }}/pdf2ofx-base-nginx:1.28-alpine
          - image: pdf2ofx-gateway
            dockerfile: apps/web/docker/Dockerfile
            target: gateway
            build_args: |
              PHP_BASE_IMAGE=ghcr.io/${{ github.repository_owner }}/pdf2ofx-base-php:8.4-fpm-alpine
              COMPOSER_BASE_IMAGE=ghcr.io/${{ github.repository_owner }}/pdf2ofx-base-composer:2.8
              NGINX_BASE_IMAGE=ghcr.io/${{ github.repository_owner }}/pdf2ofx-base-nginx:1.28-alpine
          - image: pdf2ofx-converter
            dockerfile: services/converter/Dockerfile
            target: runtime
            build_args: |
              PYTHON_BASE_IMAGE=ghcr.io/${{ github.repository_owner }}/pdf2ofx-base-python:3.13-slim-bookworm
    steps:
      - name: Obter código-fonte validado
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.validate.outputs.source_sha }}

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Autenticar no GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Gerar tags e labels OCI
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}},value=v${{ needs.validate.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=v${{ needs.validate.outputs.version }}
            type=raw,value=sha-${{ needs.validate.outputs.source_sha }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.validate.outputs.source_sha }}
            org.opencontainers.image.version=${{ needs.validate.outputs.version }}

      - name: Compilar e publicar imagem
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          build-args: ${{ matrix.build_args }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
          provenance: mode=max
          sbom: true

      - name: Confirmar imagem publicada
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ needs.validate.outputs.version }}
        run: docker buildx imagetools inspect "$IMAGE"
