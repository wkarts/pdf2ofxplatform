name: Deploy production

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Versão sem o prefixo v (ex.: 1.1.7)"
        required: true
        type: string

permissions:
  contents: read
  packages: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Validar versão
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -Eeuo pipefail
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]

      - name: Autenticar no GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Confirmar release e imagens
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          set -Eeuo pipefail
          gh release view "v${VERSION}" --repo "$GITHUB_REPOSITORY" >/dev/null

          for image in pdf2ofx-app pdf2ofx-gateway pdf2ofx-converter; do
            docker buildx imagetools inspect \
              "ghcr.io/${GITHUB_REPOSITORY_OWNER}/${image}:${VERSION}" \
              >/dev/null
          done

      - name: Deploy por SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ${{ secrets.PRODUCTION_USER }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          port: ${{ secrets.PRODUCTION_SSH_PORT || 22 }}
          script_stop: true
          script: |
            set -Eeuo pipefail

            APP_ROOT="${{ secrets.PRODUCTION_PATH || '/opt/pdf2ofx' }}"
            VERSION="${{ inputs.version }}"

            printf '%s' "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io \
              -u "${{ secrets.GHCR_USER }}" --password-stdin

            cd "$APP_ROOT"
            git fetch --tags --force origin
            git checkout --force "v${VERSION}"

            if [[ ! -f "$APP_ROOT/deploy/docker/.env" ]]; then
              echo "ERRO: deploy/docker/.env não encontrado." >&2
              echo "Execute primeiro deploy/docker/install.sh na VPS." >&2
              exit 1
            fi

            bash "$APP_ROOT/deploy/docker/update.sh" "$VERSION"
