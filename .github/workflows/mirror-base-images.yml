name: Mirror base images to GHCR

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: mirror-base-images-${{ github.repository }}
  cancel-in-progress: false

jobs:
  mirror:
    name: Mirror ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - source: php:8.4-fpm-alpine
            target: pdf2ofx-base-php:8.4-fpm-alpine
          - source: composer:2.8
            target: pdf2ofx-base-composer:2.8
          - source: nginx:1.28-alpine
            target: pdf2ofx-base-nginx:1.28-alpine
          - source: python:3.13-slim-bookworm
            target: pdf2ofx-base-python:3.13-slim-bookworm
          - source: redis:8-alpine
            target: pdf2ofx-base-redis:8-alpine
          - source: postgres:17-alpine
            target: pdf2ofx-base-postgres:17-alpine
    steps:
      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Autenticar no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Espelhar manifesto multi-arquitetura
        env:
          SOURCE_IMAGE: docker.io/library/${{ matrix.source }}
          TARGET_IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.target }}
        run: |
          set -Eeuo pipefail
          docker buildx imagetools create \
            --tag "$TARGET_IMAGE" \
            "$SOURCE_IMAGE"
          docker buildx imagetools inspect "$TARGET_IMAGE"
