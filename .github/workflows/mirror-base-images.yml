name: Mirror base images to GHCR

on:
  workflow_call:
    inputs:
      ref:
        description: Commit, tag ou branch que contém os scripts validados
        required: true
        type: string
      force:
        description: Recriar imagens-base mesmo quando já existirem no GHCR
        required: false
        default: false
        type: boolean
  workflow_dispatch:
    inputs:
      ref:
        description: Commit, tag ou branch que contém os scripts
        required: true
        default: main
        type: string
      force:
        description: Recriar imagens-base mesmo quando já existirem no GHCR
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  packages: write

concurrency:
  group: mirror-base-images-${{ github.repository }}
  cancel-in-progress: false

jobs:
  mirror:
    name: Espelhar imagens-base linux/amd64
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Autenticar no GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Obter scripts de implantação validados
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}

      - name: Espelhar imagens sequencialmente com retry
        env:
          FORCE_MIRROR: ${{ inputs.force || false }}
          GHCR_OWNER: ${{ github.repository_owner }}
        run: bash deploy/scripts/mirror-base-images.sh

      - name: Validar catálogo completo de imagens-base
        env:
          GHCR_OWNER: ${{ github.repository_owner }}
        run: |
          set -Eeuo pipefail

          images=(
            "pdf2ofx-base-php:8.4-fpm-alpine"
            "pdf2ofx-base-composer:2.8"
            "pdf2ofx-base-nginx:1.28-alpine"
            "pdf2ofx-base-python:3.13-slim-bookworm"
            "pdf2ofx-base-redis:8-alpine"
            "pdf2ofx-base-postgres:17-alpine"
          )

          for image in "${images[@]}"; do
            docker manifest inspect "ghcr.io/${GHCR_OWNER}/${image}" >/dev/null
            echo "OK: ghcr.io/${GHCR_OWNER}/${image}"
          done
