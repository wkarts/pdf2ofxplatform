name: ${COMPOSE_PROJECT_NAME:-pdf2ofx}

x-common-logging: &common-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  gateway:
    image: ${GATEWAY_IMAGE:?Defina GATEWAY_IMAGE no arquivo .env}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_HOST_PORT:-8080}:8080"
    depends_on:
      app:
        condition: service_healthy
    networks:
      - frontend
      - backend
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=64m,mode=0755
      - /var/run:size=16m,mode=0755
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    logging: *common-logging
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health | grep -Fx ok"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 10s

  app:
    image: ${APP_IMAGE:?Defina APP_IMAGE no arquivo .env}
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      converter-api:
        condition: service_healthy
    networks:
      - backend
    volumes:
      - web_storage:/var/www/html/storage
    security_opt:
      - no-new-privileges:true
    logging: *common-logging
    healthcheck:
      test: ["CMD-SHELL", "php-fpm -t >/dev/null 2>&1 && php -r 'exit(extension_loaded(\"redis\") ? 0 : 1);'"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 20s

  queue:
    image: ${APP_IMAGE:?Defina APP_IMAGE no arquivo .env}
    restart: unless-stopped
    init: true
    command:
      - php
      - artisan
      - queue:work
      - redis
      - --sleep=2
      - --tries=3
      - --timeout=900
      - --max-time=3600
    env_file:
      - .env
    depends_on:
      app:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - backend
    volumes:
      - web_storage:/var/www/html/storage
    stop_grace_period: 60s
    security_opt:
      - no-new-privileges:true
    logging: *common-logging

  scheduler:
    image: ${APP_IMAGE:?Defina APP_IMAGE no arquivo .env}
    restart: unless-stopped
    init: true
    command: ["php", "artisan", "schedule:work"]
    env_file:
      - .env
    depends_on:
      app:
        condition: service_healthy
    networks:
      - backend
    volumes:
      - web_storage:/var/www/html/storage
    security_opt:
      - no-new-privileges:true
    logging: *common-logging

  converter-api:
    image: ${CONVERTER_IMAGE:?Defina CONVERTER_IMAGE no arquivo .env}
    restart: unless-stopped
    init: true
    command:
      - uvicorn
      - pdf2ofx.api.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --workers
      - "2"
      - --proxy-headers
    env_file:
      - .env
    expose:
      - "8000"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - backend
    volumes:
      - converter_jobs:/data/jobs
    tmpfs:
      - /tmp/pdf2ofx:size=${CONVERTER_API_TMPFS_SIZE:-1024m},mode=1770
    security_opt:
      - no-new-privileges:true
    logging: *common-logging
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 20s

  converter-worker:
    image: ${CONVERTER_IMAGE:?Defina CONVERTER_IMAGE no arquivo .env}
    restart: unless-stopped
    init: true
    command:
      - celery
      - -A
      - pdf2ofx.workers.celery_app:celery_app
      - worker
      - --loglevel=INFO
      - --concurrency=${CONVERTER_WORKER_CONCURRENCY:-2}
      - --max-tasks-per-child=20
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
      converter-api:
        condition: service_healthy
    networks:
      - backend
    volumes:
      - converter_jobs:/data/jobs
    tmpfs:
      - /tmp/pdf2ofx:size=${CONVERTER_WORKER_TMPFS_SIZE:-2048m},mode=1770
    stop_grace_period: 60s
    security_opt:
      - no-new-privileges:true
    logging: *common-logging

  converter-cleaner:
    image: ${CONVERTER_IMAGE:?Defina CONVERTER_IMAGE no arquivo .env}
    restart: unless-stopped
    init: true
    command:
      - sh
      - -lc
      - while true; do python -m pdf2ofx.cli cleanup; sleep 3600; done
    env_file:
      - .env
    depends_on:
      converter-api:
        condition: service_healthy
    networks:
      - backend
    volumes:
      - converter_jobs:/data/jobs
    security_opt:
      - no-new-privileges:true
    logging: *common-logging

  redis:
    image: ${REDIS_IMAGE:-ghcr.io/wkarts/pdf2ofx-base-redis:8-alpine}
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Defina REDIS_PASSWORD no arquivo .env}
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --requirepass
      - ${REDIS_PASSWORD:?Defina REDIS_PASSWORD no arquivo .env}
    expose:
      - "6379"
    networks:
      - backend
    volumes:
      - redis_data:/data
    security_opt:
      - no-new-privileges:true
    logging: *common-logging
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep -Fx PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  postgres:
    image: ${POSTGRES_IMAGE:-ghcr.io/wkarts/pdf2ofx-base-postgres:17-alpine}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:?Defina DB_DATABASE no arquivo .env}
      POSTGRES_USER: ${DB_USERNAME:?Defina DB_USERNAME no arquivo .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD no arquivo .env}
    expose:
      - "5432"
    networks:
      - backend
    volumes:
      - postgres_data:/var/lib/postgresql/data
    shm_size: ${POSTGRES_SHM_SIZE:-256m}
    security_opt:
      - no-new-privileges:true
    logging: *common-logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

networks:
  frontend:
  backend:
    internal: true

volumes:
  web_storage:
  converter_jobs:
  redis_data:
  postgres_data:
