[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "pdf2ofx-converter"
version = "1.1.1"
description = "Engine de extração de extratos PDF e geração de OFX."
requires-python = ">=3.13"
license = {text = "Proprietary"}
dependencies = [
  "fastapi==0.139.2",
  "uvicorn[standard]>=0.34,<1",
  "celery[redis]==5.6.3",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.8,<3",
  "python-multipart>=0.0.20,<1",
  "pdfplumber>=0.11.9,<1",
  "pypdf>=5.9,<7",
  "pdf2image>=1.17,<2",
  "pytesseract>=0.3.13,<1",
  "Pillow>=11,<13",
  "opencv-python-headless>=4.11,<5",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
  "httpx>=0.28,<1",
  "ruff>=0.11,<1",
]

[project.scripts]
pdf2ofx = "pdf2ofx.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pdf2ofx"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
